# Ultralytics YOLO26-pose keypoints/pose estimation model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/pose

# Parameters
nc: 8          # obj类别数 (主分类)
num_color: 4   # color属性类别数
num_size: 2    # size属性类别数
num_obj: 8     # obj属性类别数 (与nc相同，保留用于兼容)
end2end: True
reg_max: 1
kpt_shape: [4, 2]

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.20, 512]   # 0.25 -> 0.20: 更低 GFLOPs
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,   [64,  3, 2]]        # 0-P1/2  (首层保留标准Conv，通常更稳)
  - [-1, 1, DWConv, [128, 3, 2]]        # 1-P2/4  (↓ stride=2 用DWConv)
  - [-1, 2, C3k2,   [256, False, 0.25]]
  - [-1, 1, DWConv, [256, 3, 2]]        # 3-P3/8
  - [-1, 2, C3k2,   [512, False, 0.25]]
  - [-1, 1, DWConv, [512, 3, 2]]        # 5-P4/16
  - [-1, 2, C3k2,   [512, True]]

  # P5 通道瘦身 + 下采样用DWConv
  - [-1, 1, DWConv, [768, 3, 2]]        # 7-P5/32   1024 -> 768
  - [-1, 2, C3k2,   [768, True]]
  - [-1, 1, SPPF,   [768, 5, 3, True]]  # 9
  - [-1, 2, C3k2,   [768, True]]        # 10 (替代 C2PSA)

# YOLO26 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]          # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]          # 16 (P3/8)

  - [-1, 1, DWConv, [256, 3, 2]]        # ↓ head 下采样：DWConv
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]          # 19 (P4/16)

  - [-1, 1, DWConv, [512, 3, 2]]        # ↓ head 下采样：DWConv
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [768, True, 0.5, True]]  # 22 (P5/32) 1024 -> 768

  - [[16, 19, 22], 1, Pose26, [nc, kpt_shape, reg_max, end2end, num_color, num_size, num_obj]]

